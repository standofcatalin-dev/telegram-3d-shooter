<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Platformer FPS</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: absolute;
      left: 16px;
      top: 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.8;
      z-index: 10;
      pointer-events: none;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 11;
    }

    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 255, 100, 0.8);
    }

    #crosshair::before {
      width: 2px;
      height: 16px;
    }

    #crosshair::after {
      width: 16px;
      height: 2px;
    }
  </style>
</head>
<body>
  <div id="hud">
    🎮 WASD — движение | Space — прыжок<br>
    🖱️ Мышь — поворот | Click — захват мыши
  </div>
  <div id="crosshair"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // === Инициализация ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 60, 150);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // === Освещение ===
    const ambient = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xffffff, 1.3);
    directional.position.set(50, 50, 50);
    directional.castShadow = true;
    directional.shadow.mapSize.width = 2048;
    directional.shadow.mapSize.height = 2048;
    scene.add(directional);

    // === Земля ===
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a7d44, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2;
    ground.receiveShadow = true;
    scene.add(ground);

    // === Платформы ===
    const platforms = [];

    function makePlatform(x, y, z, w, h, d, color) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      platforms.push({ mesh, w, h, d });
    }

    makePlatform(0, 0, 0, 10, 1, 10, 0x6b4c41);
    makePlatform(-15, 3, -10, 8, 1, 8, 0x8d6e63);
    makePlatform(15, 5, -15, 8, 1, 8, 0x5d4037);
    makePlatform(20, 10, 10, 10, 1, 10, 0x7b5e57);
    makePlatform(-20, 7, 15, 10, 1, 10, 0x795548);

    // === Игрок (невидимый) ===
    const player = {
      position: new THREE.Vector3(0, 3, 0),
      velocity: new THREE.Vector3(0, 0, 0),
      grounded: false,
      speed: 12,
      jumpForce: 15,
      gravity: 30
    };

    // === NPC (враг) ===
    const npc = new THREE.Group();

    const npcBodyGeo = new THREE.CapsuleGeometry(0.6, 1.8, 6, 12);
    const npcBodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.6 });
    const npcBody = new THREE.Mesh(npcBodyGeo, npcBodyMat);
    npcBody.castShadow = true;
    npc.add(npcBody);

    const npcHeadGeo = new THREE.SphereGeometry(0.45, 20, 20);
    const npcHeadMat = new THREE.MeshStandardMaterial({ color: 0xff5555, roughness: 0.5 });
    const npcHead = new THREE.Mesh(npcHeadGeo, npcHeadMat);
    npcHead.position.y = 1.4;
    npcHead.castShadow = true;
    npc.add(npcHead);

    npc.position.copy(player.position);
    npc.position.x = -10;
    scene.add(npc);

    const npcState = {
      velocity: new THREE.Vector3(0, 0, 0),
      grounded: false,
      speed: 6
    };

    // === Управление ===
    const input = {
      forward: false,
      backward: false,
      left: false,
      right: false,
      jump: false
    };

    const camera3d = {
      yaw: 0,
      pitch: 0
    };

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') input.forward = true;
      if (e.code === 'KeyS') input.backward = true;
      if (e.code === 'KeyA') input.left = true;
      if (e.code === 'KeyD') input.right = true;
      if (e.code === 'Space') input.jump = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') input.forward = false;
      if (e.code === 'KeyS') input.backward = false;
      if (e.code === 'KeyA') input.left = false;
      if (e.code === 'KeyD') input.right = false;
      if (e.code === 'Space') input.jump = false;
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === document.body) {
        camera3d.yaw -= e.movementX * 0.003;
        camera3d.pitch -= e.movementY * 0.003;
        camera3d.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, camera3d.pitch));
      }
    });

    renderer.domElement.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    // === Физика игрока ===
    function updatePlayerPhysics(delta) {
      const moveDir = new THREE.Vector3(0, 0, 0);
      const forward = new THREE.Vector3(Math.sin(camera3d.yaw), 0, Math.cos(camera3d.yaw)).normalize();
      const right = new THREE.Vector3(Math.cos(camera3d.yaw), 0, -Math.sin(camera3d.yaw)).normalize();

      if (input.forward) moveDir.addScaledVector(forward, 1);
      if (input.backward) moveDir.addScaledVector(forward, -1);
      if (input.right) moveDir.addScaledVector(right, 1);
      if (input.left) moveDir.addScaledVector(right, -1);

      if (moveDir.length() > 0) {
        moveDir.normalize();
        player.position.addScaledVector(moveDir, player.speed * delta);
      }

      if (input.jump && player.grounded) {
        player.velocity.y = player.jumpForce;
        player.grounded = false;
      }

      player.velocity.y -= player.gravity * delta;
      player.position.y += player.velocity.y * delta;

      player.grounded = false;

      for (let p of platforms) {
        const top = p.mesh.position.y + p.h / 2;
        const dx = Math.abs(player.position.x - p.mesh.position.x);
        const dz = Math.abs(player.position.z - p.mesh.position.z);

        if (dx < p.w / 2 + 0.5 && dz < p.d / 2 + 0.5) {
          if (player.position.y <= top + 0.5 && player.position.y >= p.mesh.position.y - 1) {
            if (player.velocity.y <= 0) {
              player.position.y = top;
              player.velocity.y = 0;
              player.grounded = true;
            }
          }
        }
      }

      if (player.position.y < -20) {
        player.position.set(0, 3, 0);
        player.velocity.set(0, 0, 0);
      }
    }

    // === NPC AI ===
    function updateNPCPhysics(delta) {
      const toPlayer = new THREE.Vector3();
      toPlayer.subVectors(player.position, npc.position);
      const dist = toPlayer.length();

      if (dist > 2) {
        toPlayer.normalize();
        npc.position.addScaledVector(toPlayer, npcState.speed * delta);
      }

      npc.lookAt(player.position.x, npc.position.y + 0.7, player.position.z);

      npcState.velocity.y -= player.gravity * delta;
      npc.position.y += npcState.velocity.y * delta;

      npcState.grounded = false;

      for (let p of platforms) {
        const top = p.mesh.position.y + p.h / 2;
        const dx = Math.abs(npc.position.x - p.mesh.position.x);
        const dz = Math.abs(npc.position.z - p.mesh.position.z);

        if (dx < p.w / 2 + 0.5 && dz < p.d / 2 + 0.5) {
          if (npc.position.y <= top + 0.5 && npc.position.y >= p.mesh.position.y - 1) {
            if (npcState.velocity.y <= 0) {
              npc.position.y = top;
              npcState.velocity.y = 0;
              npcState.grounded = true;
            }
          }
        }
      }

      if (npc.position.y < -20) {
        npc.position.set(-10, 3, 0);
        npcState.velocity.set(0, 0, 0);
      }
    }

    // === Камера ===
    function updateCamera() {
      const eyeHeight = 1.6;
      camera.position.set(
        player.position.x,
        player.position.y + eyeHeight,
        player.position.z
      );

      const lookTarget = new THREE.Vector3();
      lookTarget.x = player.position.x + Math.sin(camera3d.yaw) * 100;
      lookTarget.y = player.position.y + eyeHeight + Math.tan(camera3d.pitch) * 100;
      lookTarget.z = player.position.z + Math.cos(camera3d.yaw) * 100;

      camera.lookAt(lookTarget);
    }

    // === Основной loop ===
    let lastTime = Date.now();

    function animate() {
      const now = Date.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      const fixedDelta = Math.min(delta, 0.016);

      updatePlayerPhysics(fixedDelta);
      updateNPCPhysics(fixedDelta);
      updateCamera();

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
